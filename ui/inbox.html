<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memo Inbox</title>
<link rel="stylesheet" href="/ui/common.css">
</head>
<body>
<header><h1>Inbox</h1><span id="count"></span><button id="work-only" type="button" aria-pressed="false" title="Show only the work tickets: the memos with a code such as SUB-6. Key: w">Work only</button><a href="/agents">Agents</a></header>
<form id="token-form" hidden>
  <input name="token" type="password" placeholder="Token" autocomplete="off" required aria-label="Token">
  <button>Save</button>
</form>
<p id="note" role="status" hidden></p>
<form id="capture">
  <select name="to" aria-label="Agent" hidden></select>
  <textarea name="text" rows="1" placeholder="Capture a task for the agent" autocomplete="off" required aria-label="Task"></textarea>
  <button>Send</button>
  <div class="thumbs" hidden></div>
</form>
<main id="queue"></main>
<p id="empty" class="dim" hidden>No memos need you now.</p>
<div id="toasts" role="status" aria-live="polite"></div>
<footer>Keys: j and k select a memo. + and - change the impact. Command-Return sends the reply. In the capture field, Return sends and Shift-Return adds a line. To attach an image, use the picture icon in the field, paste, or drop the file.</footer>
<script type="module">
import { api, el, button, tokenForm, note, age, loadImages, themeVars, attach } from '/ui/common.js';
import { render as markdown, summary } from '/ui/markdown.js';
import { enterSends, fieldHeight } from '/ui/keys.js';

const queue = document.getElementById('queue');
const capture = document.getElementById('capture');
const drafts = new Map(); // memo id -> reply text that is not sent
let memos = [];
let ticks = []; // the small actions of now, each with `before`: the id of the memo below it
let selected = null;

function select(id) {
  selected = id;
  for (const node of queue.children) node.classList.toggle('selected', Number(node.dataset.id) === id);
}

function view(memo) {
  const area = el('textarea', { rows: 2, placeholder: 'Reply', value: drafts.get(memo.id) || '' });
  area.setAttribute('aria-label', `Reply to memo ${memo.id}`);
  area.addEventListener('input', () => drafts.set(memo.id, area.value));
  area.addEventListener('focus', () => select(memo.id));
  area.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); reply(memo, area.value); }
  });
  const thumbs = el('div', { className: 'thumbs', hidden: true });
  const facts = ` impact ${memo.impact} · ${memo.effort}${memo.due ? ` · due ${memo.due}` : ''} · ${age(memo.created)}`;
  // seen 0: the owner did not see the memo. seen 2: its text changed after the owner saw it.
  const tag = memo.seen === 1 ? '' : el('span', { className: 'tag' }, memo.seen === 2 ? 'updated' : 'new');
  const node = el('article', { className: memo.id === selected ? 'memo selected' : 'memo' },
    el('div', { className: 'meta' }, el('span', { className: 'sender' }, memo.sender), facts, tag),
    // A memo that quotes Discord text gets no frame.
    el('div', { className: 'md' }, ...markdown(memo.text, el, { html: !['liaison', 'discord'].includes(memo.sender), vars: themeVars(), onCheck: (n, on, box) => check(memo.id, n, on, box) })),
    // The notes of the memo: messages between the owner and the sender while the memo is open.
    memo.notes ? el('div', { className: 'notes' }, ...memo.notes.map((n) => el('div', { className: 'note' },
      el('div', { className: 'who' }, el('b', {}, n.author), ` · ${age(n.created)}${n.author === '__OWNER__' && !n.read ? ' · not read yet' : ''}`),
      el('div', { className: 'md' }, ...markdown(n.text, el))))) : '',
    attach(area, thumbs),
    thumbs,
    el('div', { className: 'row' },
      button('Reply', () => reply(memo, area.value), 'Send the answer. The memo leaves your Inbox.'),
      ['liaison', 'discord'].includes(memo.sender) ? '' : button('Note', () => addNote(memo, area.value), 'Send the text to the agent. The memo stays open in your Inbox.'),
      button('Close', () => close(memo), 'Close the memo. The text in the reply field goes with it.'),
      el('span', { className: 'spacer' }),
      button('Less', () => adjust(memo.id, -1), 'Decrease the impact by 1'),
      button('More', () => adjust(memo.id, 1), 'Increase the impact by 1')));
  node.dataset.id = memo.id;
  node.addEventListener('click', () => select(memo.id));
  if (tag) watch.observe(node);
  return node;
}

// A check box of a memo. The server changes the text of the memo, so the state is the same on each device.
// The list on the page gets the new text, so the next load makes no new render.
async function check(id, n, on, box) {
  try {
    const saved = await api('/api/check', { id, n, on });
    const memo = memos.find((m) => m.id === id);
    if (memo) memo.text = saved.text;
  } catch (error) { box.checked = !on; note(error.message); }
}

// A memo counts as seen when half of it (or half of the screen, for a long memo) was on the screen for 2 seconds
// while the page was in front. Then its tag fades and the server records it.
const SEEN_AFTER_MS = 2000;
const waiting = new Map(); // memo id -> timer
const watch = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    const id = Number(entry.target.dataset.id);
    const enough = entry.isIntersecting && (entry.intersectionRatio >= 0.5 || entry.intersectionRect.height >= innerHeight / 2);
    if (!enough) { clearTimeout(waiting.get(id)); waiting.delete(id); continue; }
    if (waiting.has(id)) continue;
    waiting.set(id, setTimeout(() => { waiting.delete(id); if (document.visibilityState === 'visible') markSeen(id); }, SEEN_AFTER_MS));
  }
}, { threshold: [0, 0.25, 0.5, 0.75, 1] });
document.addEventListener('visibilitychange', () => {
  // A memo that was on the screen while the page was hidden gets a new check.
  if (document.visibilityState !== 'visible') return;
  for (const node of queue.querySelectorAll('.memo')) if (node.querySelector('.tag')) { watch.unobserve(node); watch.observe(node); }
});
async function markSeen(id) {
  try {
    await api('/api/seen', { ids: [id] });
    const memo = memos.find((m) => m.id === id);
    if (memo) memo.seen = 1;
    const node = [...queue.children].find((n) => Number(n.dataset.id) === id);
    if (!node) return;
    watch.unobserve(node);
    const tag = node.querySelector('.tag');
    if (tag) { tag.classList.add('gone'); setTimeout(() => tag.remove(), 1500); }
    showToasts();
  } catch { /* the next look tries again */ }
}

// A toast for each memo that is new or updated and is not on the screen. A click on a toast goes to its memo.
// A toast stays until the owner saw the memo or closed the toast. A memo whose text changes again gets a new toast.
const MAX_TOASTS = 3;
const toasts = document.getElementById('toasts');
const closed = new Set(); // toast keys that the owner closed
const toastKey = (memo) => `${memo.id}:${memo.seen}:${memo.text.length}:${memo.notes?.length || 0}`;
const nodeOf = (id) => [...queue.children].find((n) => Number(n.dataset.id) === id);
function onScreen(node) {
  const r = node.getBoundingClientRect();
  const shown = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
  return shown >= Math.min(r.height, innerHeight) / 2;
}
function goTo(id) {
  // A toast can be for a memo that the work filter hides.
  if (!nodeOf(id) && workOnly && memos.some((c) => c.id === id)) setWorkOnly(false);
  const node = nodeOf(id);
  if (!node) return;
  select(id);
  node.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
// A toast node stays on the page while its memo needs it. Only a toast that is new gets a node, so only that
// toast plays the animation.
const toastNodes = new Map(); // toast key -> node
let moreNode = null;
function showToasts() {
  const open = memos.filter((m) => m.seen !== 1 && !closed.has(toastKey(m)) && nodeOf(m.id) && !onScreen(nodeOf(m.id)));
  const shown = open.slice(0, MAX_TOASTS);
  const keys = new Set(shown.map(toastKey));
  for (const [key, node] of toastNodes) if (!keys.has(key)) { node.remove(); toastNodes.delete(key); }
  let before = toasts.firstChild;
  for (const memo of shown) {
    const key = toastKey(memo);
    let node = toastNodes.get(key);
    if (!node) {
      node = el('div', { className: 'toast', title: 'Go to this memo' },
        el('div', { className: 'body' },
          el('span', { className: 'tag' }, memo.seen === 2 ? 'updated' : 'new'), el('span', { className: 'sender' }, memo.sender),
          el('div', { className: 'line' }, summary(memo.text) || `Memo ${memo.id}`)),
        button('×', () => { closed.add(key); showToasts(); }, 'Close this toast'));
      node.addEventListener('click', () => goTo(memo.id));
      toastNodes.set(key, node);
    }
    // A node that is already at its place does not move. A move in the page would start its animation again.
    if (node === before) before = before.nextSibling;
    else toasts.insertBefore(node, before);
  }
  const more = open.length - shown.length;
  if (more > 0) {
    if (!moreNode) moreNode = el('div', { className: 'toast more' });
    moreNode.textContent = `${more} more new or updated`;
    if (toasts.lastChild !== moreNode) toasts.append(moreNode);
  } else if (moreNode) { moreNode.remove(); moreNode = null; }
}
// A memo that comes onto the screen loses its toast.
let scrollTimer;
addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(showToasts, 150); }, { passive: true });

// A tick is one small row between the memos. It is not a memo: no tag, no toast, and no place in the count.
// A tick that the owner did stays as a done row until the next load, so the owner can take the mark back.
function tickView(tick) {
  const box = el('input', { type: 'checkbox' });
  const node = el('div', { className: 'tick' },
    el('label', {}, box, tick.text, tick.overdue ? el('span', { className: 'late' }, 'prioritize') : ''),
    button('less', () => run(() => api('/api/tick/adjust', { id: tick.id, delta: -1 })), 'Move this tick down, also on the next days'),
    button('more', () => run(() => api('/api/tick/adjust', { id: tick.id, delta: 1 })), 'Move this tick up, also on the next days'),
    button('skip today', () => run(() => api('/api/tick/skip', { id: tick.id })), 'Remove this tick for today'));
  box.addEventListener('change', async () => {
    try {
      await api(box.checked ? '/api/tick/done' : '/api/tick/undo', { id: tick.id });
      node.classList.toggle('done', box.checked);
      if (box.checked) doneTicks.set(tick.id, tick); else doneTicks.delete(tick.id);
    } catch (error) { box.checked = !box.checked; note(error.message); }
  });
  if (doneTicks.has(tick.id)) { box.checked = true; node.classList.add('done'); }
  node.dataset.tick = tick.id;
  return node;
}
const doneTicks = new Map(); // ticks that the owner did on this page, for the done rows

import { shownMemos, step, countText } from '/ui/filter.js';
// The work filter: when it is on, the list shows only the work tickets, and no ticks. The page keeps the state.
const WORK_KEY = 'memo-work-only';
const workButton = document.getElementById('work-only');
let workOnly = false;
try { workOnly = localStorage.getItem(WORK_KEY) === '1'; } catch { /* a private window: the filter starts off */ }
const shown = () => shownMemos(memos, workOnly);
function setWorkOnly(on) {
  workOnly = on;
  try { localStorage.setItem(WORK_KEY, on ? '1' : '0'); } catch { /* a private window: the state stays in memory */ }
  render();
  nodeOf(selected)?.scrollIntoView({ behavior: 'instant', block: 'nearest' });
}
workButton.addEventListener('click', () => { setWorkOnly(!workOnly); workButton.blur(); });

function render() {
  const list = shown();
  const rows = workOnly ? [] : ticks;
  if (!list.some((c) => c.id === selected)) selected = list[0]?.id ?? null;
  watch.disconnect();
  for (const timer of waiting.values()) clearTimeout(timer);
  waiting.clear();
  queue.replaceChildren(...list.map(view));
  for (const tick of rows) queue.insertBefore(tickView(tick), tick.before === null ? null : nodeOf(tick.before) || null);
  loadImages(queue);
  workButton.setAttribute('aria-pressed', String(workOnly));
  document.getElementById('count').textContent = countText(list.length, memos.length, workOnly);
  const empty = document.getElementById('empty');
  empty.textContent = workOnly ? 'No work tickets need you now.' : 'No memos need you now.';
  empty.hidden = list.length > 0 || rows.length > 0;
}

async function load() {
  try {
    const data = await api('/api/queue');
    note('');
    const next = data.memos;
    // A done row stays at its place while the server does not give the tick again.
    for (const t of data.ticks) doneTicks.delete(t.id);
    const nextTicks = [...data.ticks, ...[...doneTicks.values()]];
    // A new render makes each frame again and runs its script again, so render only when the list changed.
    const changed = JSON.stringify([next, nextTicks]) !== JSON.stringify([memos, ticks]) || !queue.children.length;
    memos = next;
    ticks = nextTicks;
    if (changed) { render(); showToasts(); }
  } catch (error) { note(error.message); }
}

async function run(action) {
  try { await action(); await load(); } catch (error) { note(error.message); }
}
const reply = (memo, text) => {
  if (!text.trim()) return note('Write a reply first.');
  return run(async () => { await api('/api/reply', { id: memo.id, text }); drafts.delete(memo.id); });
};
const addNote = (memo, text) => {
  if (!text.trim()) return note('Write a note first.');
  return run(async () => { await api('/api/note', { id: memo.id, from: '__OWNER__', text }); drafts.delete(memo.id); });
};
const close = (memo) => run(async () => { await api('/api/close', { id: memo.id, text: drafts.get(memo.id) || undefined }); drafts.delete(memo.id); });
const adjust = (id, delta) => run(() => api('/api/adjust', { id, delta }));

async function loadAgents() {
  try {
    const long = (await api('/api/agents')).filter((a) => a.kind !== 'short');
    capture.elements.to.replaceChildren(...long.map((a) => el('option', { value: a.name }, a.name)));
    capture.elements.to.hidden = long.length < 2;
  } catch (error) { note(error.message); }
}
let sending = false; // a second Enter or a second click while a memo goes out must not send the text again
capture.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (sending) return;
  const to = capture.elements.to.value;
  if (!to) return note('The list of agents did not load. Load the page again.');
  sending = true;
  try {
    await run(async () => {
      await api('/api/send', { from: '__OWNER__', to, text: capture.elements.text.value });
      capture.elements.text.value = '';
      capture.elements.text.dispatchEvent(new Event('input'));
    });
  } finally { sending = false; }
});
// The capture field grows with its text, to 40% of the window height.
function grow() {
  const field = capture.elements.text;
  field.style.height = 'auto';
  field.style.height = `${fieldHeight(field.scrollHeight + field.offsetHeight - field.clientHeight, window.innerHeight * 0.4)}px`;
}
capture.elements.text.addEventListener('input', grow);
attach(capture.elements.text, capture.querySelector('.thumbs'));
capture.elements.text.addEventListener('keydown', (event) => {
  if (!enterSends(event, matchMedia('(pointer: coarse)').matches)) return;
  event.preventDefault();
  capture.requestSubmit();
});

// A check box keeps the focus after a click. It is not a field with text, so the keys and the refresh continue.
const typing = () => {
  const at = document.activeElement;
  return ['TEXTAREA', 'INPUT', 'SELECT'].includes(at?.tagName) && at.type !== 'checkbox';
};
document.addEventListener('keydown', (event) => {
  if (typing() || event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === 'w') return setWorkOnly(!workOnly);
  const list = shown();
  if (!list.length) return;
  if (event.key === 'j' || event.key === 'k') {
    // The keys move through the memos that the list shows. The page follows the selection with no animation.
    select(step(list, selected, event.key === 'j' ? 1 : -1));
    nodeOf(selected)?.scrollIntoView({ behavior: 'instant', block: 'nearest' });
  } else if (event.key === '+' || event.key === '=') adjust(selected, 1);
  else if (event.key === '-') adjust(selected, -1);
});

tokenForm(() => { load(); loadAgents(); });
load();
loadAgents();
// A new list replaces the reply fields, so the page does not load while the owner types.
setInterval(() => { if (!typing()) load(); }, 15000);
</script>
</body>
</html>
