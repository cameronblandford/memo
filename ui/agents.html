<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memo Agents</title>
<link rel="stylesheet" href="/ui/common.css">
<style>
.output { max-height: 24rem; overflow-y: auto; margin-top: .4rem; padding: .25rem .6rem; border: 1px solid var(--line); border-radius: .5rem; font-size: .9rem; }
.output .entry { padding: .3rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.output .entry:last-child { border-bottom: 0; }
.output .entry.tool { color: var(--dim); font-size: .85rem; }
.output .tool-name { color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.output .md > :first-child { margin-top: 0; }
.output .md > :last-child { margin-bottom: 0; }
/* The tail of a session. It scrolls inside its box, so a long line does not make the page wider. */
.screen pre { margin: .5rem 0; padding: .5rem .65rem; max-height: 22rem; overflow: auto; background: var(--bg); border: 1px solid var(--line);
  border-radius: .5rem; font: .72rem/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.screen summary { cursor: pointer; color: var(--dim); font-size: .9rem; }
.dialog { color: var(--warn); font-weight: 600; }
.computer { margin-left: .4rem; color: var(--dim); font-size: .8rem; font-weight: 400; }
</style>
</head>
<body>
<header><h1>Agents</h1><a href="/inbox">Inbox</a><a href="/desk">Desk</a><a href="/chat">Chat</a><a href="/log">Log</a></header>
<form id="token-form" hidden>
  <input name="token" type="password" placeholder="Token" autocomplete="off" required aria-label="Token">
  <button>Save</button>
</form>
<p id="note" role="status" hidden></p>
<main id="list"></main>
<footer>The screen is the end of each session, read each 5 seconds (each 15 seconds for an agent on another computer). Escape closes a Claude Code dialog. To type into a session, use Remote Control in the Claude app, or run tmux attach -t memo-&lt;name&gt; on its computer.</footer>
<script type="module">
import { api, el, button, tokenForm, note, age, loadImages } from '/ui/common.js';
import { render as markdown } from '/ui/markdown.js';

const list = document.getElementById('list');
// The screens that the owner closed. They stay closed after each reload of the list.
const closed = new Set();
try { for (const name of JSON.parse(localStorage.getItem('memo-closed-screens') || '[]')) closed.add(name); } catch {}
// The text of the last view. The list is built again only when it changes, so a tap does not go to a button that the list removed.
let shown = '';
// A note stays until this time. After it, the next load that works removes the note.
let keepNote = 0;
const remember = () => { try { localStorage.setItem('memo-closed-screens', JSON.stringify([...closed])); } catch {} };

function state(agent) {
  if (agent.kind === 'short') return `Last run: ${age(agent.updated)}`;
  if (agent.kind === 'remote') return agent.online ? 'Online' : `Offline${agent.contact ? `, last contact ${age(agent.contact)}` : ''}`;
  if (agent.stopping_since) return 'Stopping, waits for the recap';
  if (agent.running) return 'Running';
  return agent.last_stop === 'no_recap' ? 'Stopped with no recap' : 'Stopped';
}

function control(agent) {
  if (agent.stopping_since) return button('Stop now', () => run('/api/agent/stop', { name: agent.name, now: true }), 'End the session immediately, with no recap');
  if (agent.running) return button('Stop', () => run('/api/agent/stop', { name: agent.name }), 'Ask for a recap, then end the session');
  return button('Start', () => run('/api/agent/start', { name: agent.name }));
}

async function key(agent, k) {
  try {
    await api('/api/agent/key', { name: agent.name, key: k });
    if (agent.kind === 'remote') { note(`${k} goes to ${agent.name} with its next screen, in 15 seconds or less.`); keepNote = Date.now() + 20000; }
  } catch (error) { note(error.message); keepNote = Date.now() + 8000; return; }
  setTimeout(load, 700);
}

function screenView(agent, screen) {
  const details = el('details', { className: 'screen', open: !closed.has(agent.name) });
  details.addEventListener('toggle', () => { if (details.open) closed.delete(agent.name); else closed.add(agent.name); remember(); });
  if (!screen || screen.text === null) {
    details.append(el('summary', {}, 'Screen'), el('p', { className: 'dim' }, agent.kind === 'remote' ? 'No screen yet. The computer of the agent sends it while the session runs.' : 'No session.'));
    return details;
  }
  const summary = el('summary', {}, `Screen, ${age(screen.at)}; last change ${age(screen.changed)}`);
  const pre = el('pre', {}, screen.text);
  details.append(summary);
  if (screen.dialog) details.append(el('p', { className: 'dialog' }, 'A dialog waits for an answer. Escape closes it.'));
  details.append(pre, el('div', { className: 'row' },
    button('Escape', () => key(agent, 'Escape'), 'Send Escape: close a dialog, or interrupt the turn'),
    button('Enter', () => key(agent, 'Enter'), 'Send Enter: confirm the selected choice of a dialog')));
  // Show the end of the screen, as a terminal does.
  requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
  return details;
}

function view(agent, screen) {
  const parts = [el('div', { className: 'meta' }, el('span', { className: 'sender' }, agent.name),
    agent.computer ? el('span', { className: 'computer', title: 'Computer' }, agent.computer) : '', `${agent.computer ? ' · ' : ' '}${state(agent)}`)];
  if (agent.kind !== 'short') {
    parts.push(el('p', { className: 'text' }, agent.status ? `${agent.status} (${age(agent.updated)})` : 'No status line.'));
  }
  parts.push(el('p', { className: 'dim' }, `Open memos to ${agent.name}: ${agent.open_to}. Open memos from ${agent.name}: ${agent.open_from}.`));
  if (agent.kind !== 'short' && agent.recap && !agent.running && !agent.online) {
    parts.push(el('details', { open: true }, el('summary', {}, `Recap, ${age(agent.recap_at)}`), el('div', { className: 'md' }, ...markdown(agent.recap, el))));
  }
  if (agent.kind !== 'short' && (agent.running || agent.kind === 'remote')) parts.push(screenView(agent, screen));
  if (agent.kind === 'long') parts.push(el('div', { className: 'row' }, control(agent)));
  return parts;
}

// One card for each agent. The card stays in the page, so its output box keeps its place and its scroll.
const cards = new Map(); // name -> { article, head, output }

function card(agent, screen) {
  let c = cards.get(agent.name);
  if (!c) {
    const head = el('div');
    c = { article: el('article', { className: 'memo' }, head), head, output: null };
    c.article.dataset.name = agent.name;
    cards.set(agent.name, c);
  }
  c.head.replaceChildren(...view(agent, screen));
  if (agent.output && !c.output) {
    c.output = { box: el('div', { className: 'output', role: 'log', ariaLabel: `Output of ${agent.name}` }, el('p', { className: 'dim' }, 'No output yet.')), file: null, cursor: null };
    c.article.append(el('details', { open: true }, el('summary', {}, 'Live output'), c.output.box));
  }
  return c.article;
}

async function load() {
  try {
    const agents = await api('/api/agents');
    const screens = await Promise.all(agents.map((a) => (a.kind !== 'short' && (a.running || a.kind === 'remote') ? api(`/api/agent/screen?name=${encodeURIComponent(a.name)}`).catch(() => null) : null)));
    if (Date.now() > keepNote) note('');
    const current = JSON.stringify([agents.map((a) => [{ ...a, contact: age(a.contact) }, age(a.updated), age(a.recap_at)]),
      screens.map((x) => x && [x.text, x.dialog, age(x.at), age(x.changed)])]);
    if (current === shown) return;
    shown = current;
    // A rebuild of a card must not move the page or a screen that the owner scrolled.
    const scrolled = new Map([...list.querySelectorAll('article')].map((n) => [n.dataset.name, n.querySelector('.screen pre')]).filter(([, p]) => p && p.scrollTop + p.clientHeight < p.scrollHeight - 4).map(([name, p]) => [name, p.scrollTop]));
    const articles = agents.map((a, i) => card(a, screens[i]));
    // An agent that the server does not give any more loses its card, so poll() does not ask for it.
    for (const name of cards.keys()) if (!agents.some((x) => x.name === name)) cards.delete(name);
    // Put the cards in the list only when the list changes. To move a card resets the scroll of its output box.
    if (articles.length !== list.children.length || articles.some((a, i) => list.children[i] !== a)) list.replaceChildren(...articles);
    for (const [name, top] of scrolled) { const p = list.querySelector(`article[data-name="${CSS.escape(name)}"] .screen pre`); if (p) requestAnimationFrame(() => { p.scrollTop = top; }); }
    loadImages(list);
  } catch (error) { note(error.message); keepNote = 0; }
}

const MAX_ENTRIES = 50;
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');

function entry(e) {
  if (e.kind === 'tool') {
    return el('div', { className: 'entry tool', title: clock(e.at) }, el('span', { className: 'tool-name' }, e.name), e.description ? ` ${e.description}` : '');
  }
  return el('div', { className: 'entry text md', title: clock(e.at) }, ...markdown(e.text, el));
}

let busy = false;
async function poll() {
  if (busy) return;
  busy = true;
  for (const [name, c] of cards) {
    const out = c.output;
    if (!out) continue;
    // Each agent has its own try: an error for one agent does not stop the output of the others.
    try {
      const q = new URLSearchParams({ name });
      if (out.file) { q.set('file', out.file); q.set('cursor', out.cursor); }
      const r = await api(`/api/agent/output?${q}`);
      const box = out.box;
      // Follow the end only if the reader is at the end. A reader who scrolled up keeps the place.
      const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      if (r.reset) box.replaceChildren();
      if (r.reset || r.entries.length) {
        box.querySelector(':scope > p.dim')?.remove();
        box.append(...r.entries.map(entry));
        while (box.children.length > MAX_ENTRIES) box.firstChild.remove();
        if (!box.children.length) box.append(el('p', { className: 'dim' }, 'No output yet.'));
        if (atEnd || r.reset) box.scrollTop = box.scrollHeight;
      }
      out.file = r.file;
      out.cursor = r.cursor;
    } catch { /* the next poll tries again; load() shows the error */ }
  }
  busy = false;
}
async function run(path, body) {
  try { await api(path, body); } catch (error) { note(error.message); keepNote = Date.now() + 8000; return; }
  shown = '';
  await load();
}

tokenForm(load);
load().then(poll);
setInterval(load, 5000);
setInterval(poll, 3000);
</script>
</body>
</html>
